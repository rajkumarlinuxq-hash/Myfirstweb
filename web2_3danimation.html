<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node 2 | Unlimited 3D Animation Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-panel active-panel">
        <h2>3D Kinetic Animation Laboratory</h2>
        <p class="description">Unlimited dynamic structural animation scripts and matrices compiled natively.</p>
        
        <div style="width:100%; height:150px; position:relative; background:#000; border-radius:15px; overflow:hidden; display:flex; align-items:center; justify-content:center;">
            <div style="width:50px; height:50px; background:var(--asmani); box-shadow:0 0 20px var(--asmani); animation: sampleRotation 3s infinite linear;"></div>
        </div>
        <style>@keyframes sampleRotation { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.2); filter:hue-rotate(90deg); } 100% { transform: rotate(360deg) scale(1); } }</style>

        <div class="input-wrapper">
            <label>Select Animation Generator Array:</label>
            <input type="text" readonly value="Matrix-Cube-Core, Neon-Touch-Trail, Dynamic-Helix-Canvas">
        </div>
        
        <a href="index.html" class="btn-action" style="text-decoration:none; display:block; text-align:center;">⬅️ Back to Main Web Hub</a>
    </div>
</body>
</html>
